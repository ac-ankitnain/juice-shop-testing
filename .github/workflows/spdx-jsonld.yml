name: Generate SPDX 3.0 JSON-LD SBOM

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Syft & sbomasm
        run: |
          # 1. Install Syft (SBOM generator)
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

          # 2. Install sbomasm (SPDX 3.0 assembler)
          curl -sSfL https://raw.githubusercontent.com/interlynk-io/sbomasm/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan and Generate SPDX 3.0 JSON-LD
        run: |
          # Generate base scan from the workspace files
          syft scan dir:. -o spdx-json=raw-spdx23.json

          # Assemble directly into SPDX 3.0 JSON-LD format
          sbomasm convert -t spdx3 raw-spdx23.json -o dependency_graph.spdx.jsonld

      - name: Upload SPDX JSON-LD Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spdx-3-jsonld-sbom
          path: dependency_graph.spdx.jsonld
